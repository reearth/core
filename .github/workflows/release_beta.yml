on:
  push:
    branches: beta
    paths-ignore:
      - "package.json"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: reearth/core/.github/workflows/npm_release.yml@e7d30c2d0f21c8d019dc16424fd4ee32b648d674 # alpha
    with:
      branch: beta
      tag: beta
      version-args: --preid beta prerelease
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT: ${{ secrets.PAT }}
