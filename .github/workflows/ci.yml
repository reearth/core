name: ci

on:
  push:
    branches: [main, beta, alpha]
  pull_request:

jobs:
  lint_test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "path=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.path }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Run install
        run: yarn install --frozen-lockfile
      - name: Run lint
        run: yarn lint
      - name: Run test
        run: yarn test
      # Guards `tsc && vite build`. Without this a type error only surfaces during
      # the release workflow, i.e. after it has already landed on alpha.
      - name: Run build
        run: yarn build
