name: ci

on:
  push:
    branches: [main, beta, alpha]
  pull_request:

jobs:
  lint_test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Run install
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run test
        run: pnpm test
      # Guards `tsc && vite build`. Without this a type error only surfaces during
      # the release workflow, i.e. after it has already landed on alpha.
      - name: Run build
        run: pnpm build
