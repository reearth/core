name: ci

on:
  push:
    branches: [main, beta, alpha]
  pull_request:

jobs:
  lint_test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Run install
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run test
        run: pnpm test
      # Guards `tsc && vite build`. Without this a type error only surfaces during
      # the release workflow, i.e. after it has already landed on alpha.
      - name: Run build
        run: pnpm build
