name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - custom
        default: prerelease
      custom-version:
        description: 'Custom version (only used if version-type is "custom", e.g., 1.0.0-alpha.1)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: alpha
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "path=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.path }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git
        run: |
          git config --global user.name "keiya01"
          git config --global user.email "34934510+keiya01@users.noreply.github.com"

      - name: Get current version
        id: current-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Determine version arguments
        id: version-args
        run: |
          if [ "${{ inputs.version-type }}" == "custom" ]; then
            if [ -z "${{ inputs.custom-version }}" ]; then
              echo "Error: custom-version is required when version-type is 'custom'"
              exit 1
            fi
            echo "args=${{ inputs.custom-version }}" >> $GITHUB_OUTPUT
          else
            echo "args=--preid alpha ${{ inputs.version-type }}" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: bump-version
        run: |
          npm version ${{ steps.version-args.outputs.args }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previous-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.previous-tag.outputs.tag }}"
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"

          # Generate changelog for PR description
          {
            echo "## Changes since $PREV_TAG"
            echo ""
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$NEW_VERSION"
          } > CHANGELOG_TEMP.md

          # Generate release notes for GitHub Release (more detailed)
          {
            echo "## What's Changed"
            echo ""
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            echo "## Contributors"
            echo ""
            git log $PREV_TAG..HEAD --pretty=format:"- @%an" --no-merges | sort -u
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$NEW_VERSION"
          } > RELEASE_NOTES.md

          # Display both
          echo "=== Changelog for PR ==="
          cat CHANGELOG_TEMP.md
          echo ""
          echo "=== Release Notes for GitHub Release ==="
          cat RELEASE_NOTES.md

          # Store changelog as multiline output
          {
            echo "content<<EOF"
            cat CHANGELOG_TEMP.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

          # Store release notes as multiline output
          {
            echo "release_notes<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release branch
        run: |
          BRANCH_NAME="release/v${{ steps.bump-version.outputs.new_version }}"
          git checkout -b $BRANCH_NAME
          git add package.json yarn.lock
          git commit -m "chore: release v${{ steps.bump-version.outputs.new_version }}"
          git push origin $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        id: create-branch

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          branch: ${{ steps.create-branch.outputs.branch_name }}
          base: alpha
          title: "Release v${{ steps.bump-version.outputs.new_version }}"
          body: |
            # Release v${{ steps.bump-version.outputs.new_version }}

            This PR bumps the version from **v${{ steps.current-version.outputs.version }}** to **v${{ steps.bump-version.outputs.new_version }}**.

            ## Changelog

            ${{ steps.changelog.outputs.content }}

            ---

            ## After Merging

            **Manual steps required after merging this PR:**

            ### 1. Create Git Tag
            ```bash
            git checkout alpha
            git pull origin alpha
            git tag -a "v${{ steps.bump-version.outputs.new_version }}" -m "Release v${{ steps.bump-version.outputs.new_version }}"
            git push origin "v${{ steps.bump-version.outputs.new_version }}"
            ```

            ### 2. Create GitHub Release
            - Go to: https://github.com/${{ github.repository }}/releases/new
            - **Tag**: `v${{ steps.bump-version.outputs.new_version }}`
            - **Title**: `v${{ steps.bump-version.outputs.new_version }}`
            - **Pre-release**: ✅ Check this box
            - **Description**: Copy the release notes below

            <details>
            <summary>📋 Release Notes (click to expand - copy this for GitHub Release)</summary>

            ```markdown
            ${{ steps.changelog.outputs.release_notes }}
            ```

            </details>

            ### 3. Publish to NPM
            ```bash
            npm publish --tag alpha
            ```

            ---

            **Note:** You can also use GitHub Actions to automate publishing:
            - Go to Actions → "Publish Alpha Release" → Run workflow

          labels: release
          assignees: ${{ github.actor }}

      - name: Summary
        run: |
          echo "### Release PR Created :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.bump-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Version**: ${{ steps.current-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base**: alpha" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Request**: ${{ steps.create-pr.outputs.pull-request-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review and merge the PR" >> $GITHUB_STEP_SUMMARY
          echo "2. Follow the manual steps in the PR description to publish" >> $GITHUB_STEP_SUMMARY
