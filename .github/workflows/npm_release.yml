on:
  workflow_call:
    inputs:
        branch:
          required: true
          type: string
        tag:
          required: true
          type: string
        version-args:
            required: true
            type: string
    secrets:
      PAT:
        required: true
      NPM_TOKEN:
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Run install
        run: pnpm install --frozen-lockfile

      - name: Set up github actions user
        run: |
          git config --global user.name "keiya01"
          git config --global user.email "34934510+keiya01@users.noreply.github.com"

      - name: Run npm version
        run: npm version ${{ inputs.version-args }}

      - name: Git push
        run: |
          git push origin ${{ inputs.branch }}
          git push --tags

      - name: Release to NPM
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          token: ${{ secrets.NPM_TOKEN }}
          tag: ${{ inputs.tag }}
