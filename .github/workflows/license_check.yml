name: License Check

on:
  workflow_dispatch:
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      modified: ${{ steps.check.outputs.any_modified }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Check for dependency changes
        id: check
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1
        with:
          files: |
            package.json
            yarn.lock

  license-check:
    name: License Check
    needs: prepare
    if: needs.prepare.outputs.modified == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: 'yarn.lock'
          
      - name: Install
        run: yarn install
        
      - uses: reearth/actions/license-checker/npm@e445d10332411e14f53e6abc73c966ecb49d3e57
