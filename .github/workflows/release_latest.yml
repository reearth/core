on:
  workflow_dispatch:
    inputs:
      version-type:
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    permissions:
      contents: write
    uses: reearth/core/.github/workflows/npm_release.yml@e7d30c2d0f21c8d019dc16424fd4ee32b648d674 # alpha
    with:
      branch: main
      tag: latest
      version-args: ${{ inputs.version-type }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT: ${{ secrets.PAT }}
